# Railway build plan: install Python and Node, build the simulator bundle,
# then serve both the API and the bundle from one uvicorn process.

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt",
  "cd app && npm ci",
]

[phases.build]
cmds = ["cd app && npm run build"]

[start]
cmd = ". /opt/venv/bin/activate && python main.py serve"
